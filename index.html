<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    :root {
      --wweb2-overlay-btn-disabled: true;
      --wweb2-overlay-btn-color: transparent;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    a.circle-widget {
      position: relative;
      width: 100vmin;
      height: 100vmin;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
    }
    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 9;
    }
    .progress {
      fill: none;
      stroke: #4deeea;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.4s ease;
      filter: drop-shadow(0 0 6px rgba(77, 238, 234, 0.7));
    }
    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .percent-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 0.9;
    }
    .percent {
      font-size: 26vmin;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .percent-symbol {
      font-size: 13vmin;
      font-weight: 700;
      color: #4deeea;
      margin-left: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .label {
      font-size: 9vmin;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>

  <a class="circle-widget" href="#refresh">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"></circle>
      <circle class="progress" id="ring" cx="50" cy="50" r="45"></circle>
    </svg>

    <div class="content">
      <div class="percent-row">
        <span class="percent" id="display">0</span>
        <span class="percent-symbol">%</span>
      </div>
      <span class="label">Shift</span>
    </div>
  </a>

  <script>
    function updateProgress() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 0, 0).getTime();
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 16, 0, 0).getTime();
      const current = now.getTime();

      let pct = 0;
      if (current <= start) {
        pct = 0;
      } else if (current >= end) {
        pct = 100;
      } else {
        pct = Math.min(100, Math.max(0, Math.round(((current - start) / (end - start)) * 100)));
      }

      const displayEl = document.getElementById("display");
      const ringEl = document.getElementById("ring");

      if (displayEl && ringEl) {
        displayEl.innerText = pct;
        // Circumference: 2 * Math.PI * 45 ≈ 282.74
        const circumference = 282.74;
        const offset = circumference - (pct / 100) * circumference;
        ringEl.style.strokeDashoffset = offset;
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", updateProgress);
    } else {
      updateProgress();
    }

    function __wweb2JsWidgetTitle() {
      return "Timer Progress";
    }
  </script>
</body>
</html>
