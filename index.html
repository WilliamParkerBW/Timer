<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    :root {
      --wweb2-overlay-btn-disabled: false;
      --wweb2-overlay-btn-color: transparent;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: transparent;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    a.widget-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      width: 100%;
      height: 100%;
    }
    .percent {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #FFFFFF;
    }
    .bar-container {
      width: 82%;
      height: 6px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #FFFFFF;
      width: 0%;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <a class="widget-btn" href="#refresh">
    <div class="percent" id="display">--%</div>
    <div class="bar-container">
      <div class="bar-fill" id="fill"></div>
    </div>
  </a>

  <script>
    function updateProgress() {
      const now = new Date();

      // Set target to today 10:00 AM (start) and 4:00 PM / 16:00 (end)
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 0, 0).getTime();
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 16, 0, 0).getTime();
      const current = now.getTime();

      let pct = 0;
      if (current <= start) {
        pct = 0;
      } else if (current >= end) {
        pct = 100;
      } else {
        pct = Math.min(100, Math.max(0, Math.round(((current - start) / (end - start)) * 100)));
      }

      const displayEl = document.getElementById("display");
      const fillEl = document.getElementById("fill");

      if (displayEl && fillEl) {
        displayEl.innerText = pct + "%";
        fillEl.style.width = pct + "%";
      }
    }

    // Run immediately when DOM is ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", updateProgress);
    } else {
      updateProgress();
    }

    function __wweb2JsWidgetTitle() {
      return "10 AM - 4 PM Timer";
    }
  </script>
</body>
</html>
