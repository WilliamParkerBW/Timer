<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    :root {
      --wweb2-overlay-btn-disabled: false;
      --wweb2-overlay-btn-color: transparent;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: transparent;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    a.widget-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      width: 100%;
      height: 100%;
    }
    .percent {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .bar-container {
      width: 82%;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #FFFFFF;
      width: 0%;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- Tap anywhere on the Lock Screen widget to force an instant percentage recalculation -->
  <a class="widget-btn" href="#refresh">
    <div class="percent" id="display">0%</div>
    <div class="bar-container">
      <div class="bar-fill" id="fill"></div>
    </div>
  </a>

  <script>
    const now = new Date();

    // 10:00 AM (Today) -> 4:00 PM / 16:00 (Today)
    const startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 0, 0).getTime();
    const endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 16, 0, 0).getTime();
    const currentTime = now.getTime();

    let percent = 0;
    if (currentTime <= startTime) {
      percent = 0;
    } else if (currentTime >= endTime) {
      percent = 100;
    } else {
      percent = Math.min(100, Math.max(0, Math.round(((currentTime - startTime) / (endTime - startTime)) * 100)));
    }

    document.getElementById("display").innerText = percent + "%";
    document.getElementById("fill").style.width = percent + "%";

    function __wweb2JsWidgetTitle() {
      return "10 AM - 4 PM Progress";
    }
  </script>
</body>
</html>
